name: pi_link_status
description: "System tray monitor for pi-link terminals."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  tray_manager: ^0.5.3
  window_manager: ^0.5.2

# tray_manager 0.5.3 leaves its two Windows NOTIFYICON* members uninitialized
# and reads them before writing; there is no fixed release. third_party holds
# the official 0.5.3 with that one correction — see its PATCHES.md. Deleting
# this block goes back to the published package.
dependency_overrides:
  tray_manager:
    path: third_party/tray_manager

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.9.2

flutter:
  uses-material-design: true
  assets:
    - assets/tray/
