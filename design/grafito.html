<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Graphite — static mockup of pi-link status (420×320 logical)</title>
<style>
  /*
   * Self-contained HTML/CSS mockup. A visual approximation, NOT evidence of the
   * Flutter runtime. Illustrative data. No dependencies, no network.
   *
   * Palette (final colors, no alpha, so contrast can be measured):
   *   background   #1B1B1F
   *   border       #34343A   (1 px)
   *   hairline     #2A2A2F
   *   primary      #F2EFEA   warm white (names)
   *   secondary    #ACA9A4   metadata, @suffix, right rail, history
   *   path         #9C9994
   *   hint         #8F8C88   "Click to hide"
   *   idle         #81C784 · working #64B5F6 · compacting #FFD54F
   *   gray         #9E9E9E   offline / unknown
   */
  :root {
    --bg: #1B1B1F;
    --border: #34343A;
    --hair: #2A2A2F;
    --fg: #F2EFEA;
    --meta: #ACA9A4;
    --path: #9C9994;
    --hint: #8F8C88;
    --idle: #81C784;
    --busy: #64B5F6;
    --compact: #FFD54F;
    --grey: #9E9E9E;
    --thumb: #6B6B72;
  }
  html, body { margin: 0; background: #0E0E10; color: #C8C6C2; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    padding: 24px;
    display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start;
  }
  figure { margin: 0; }
  figcaption { font-size: 12px; color: #8F8C88; margin: 0 0 8px 0; max-width: 420px; }

  /* The window: 420×320 logical, box-sizing includes the 1 px border. */
  .win {
    box-sizing: border-box;
    width: 420px; height: 320px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-left: 3px solid var(--edge, var(--grey)); /* fleet-state accent */
    color: var(--fg);
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 12px; line-height: 16px;
    font-variant-numeric: tabular-nums;
    display: flex; flex-direction: column;
    padding: 10px 16px 8px 16px;
    overflow: hidden;
  }
  .win.busy    { --edge: var(--busy); }
  .win.idle    { --edge: var(--idle); }
  .win.compact { --edge: var(--compact); }
  .win.off     { --edge: var(--grey); }

  /* Fixed header: the fleet state leads, the scope is secondary. */
  .title {
    font-size: 15px; line-height: 20px; font-weight: 600;
    color: var(--edge, var(--fg));
    letter-spacing: .1px;
  }
  .scope {
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px;
    color: var(--meta); margin-top: 2px;
  }
  .mute { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .mute svg { width: 12px; height: 12px; stroke: var(--meta); fill: none; stroke-width: 1.6; }
  hr { border: 0; border-top: 1px solid var(--hair); margin: 6px 0 0 0; }

  /* List: the only scrolling area; header and footer stay put. */
  .list { position: relative; flex: 1; min-height: 0; overflow: hidden; padding-top: 6px; }
  .rows { display: flex; flex-direction: column; gap: 7px; padding-right: 10px; }
  .row { display: flex; flex-direction: column; gap: 1px; }
  .l1, .l2 { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 12px; }
  .l1 { font-size: 14px; line-height: 18px; }
  .name { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; font-weight: 600; padding-left: 15px; /* hanging indent: wrapped lines align under the text, not under the dot */ }
  .name .at { font-weight: 400; color: var(--meta); font-size: 13px; }
  .name .hub { font-weight: 400; color: var(--meta); font-size: 12px; letter-spacing: .04em; margin-left: 8px; }
  .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    margin: 0 8px 1px -15px; vertical-align: middle;
    background: var(--c);
  }
  .dot.idle    { --c: var(--idle); }
  .dot.busy    { --c: var(--busy); }
  .dot.compact { --c: var(--compact); }
  .dot.unknown { background: transparent; box-shadow: inset 0 0 0 1.5px var(--grey); }
  .rail { margin-left: auto; color: var(--meta); white-space: nowrap; font-size: 12px; line-height: 18px; }
  .rail .age { display: inline-block; min-width: 3ch; text-align: right; margin-left: 10px; }
  .ctx .pct { display: inline-block; min-width: 5ch; text-align: right; margin-left: 10px; } /* "(33%)" = 5ch: aligns the tokens column */
  .rail .age:empty, .ctx .pct:empty { display: none; } /* No percent (unknown tokens): nothing to align. The age is absent only when the status is absent (shown as "?"); an unknown status keeps its age. */
  .path {
    flex: 1 1 auto; min-width: 0; color: var(--path);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; /* as today: end ellipsis */
    padding-left: 15px; /* aligns with the name, under the dot */
  }
  .ctx { margin-left: auto; color: var(--meta); white-space: nowrap; }

  /* Overflow indicator: 3 px thumb on the right edge of the list. */
  .thumb { position: absolute; right: 0; top: 6px; width: 3px; border-radius: 2px; background: var(--thumb); }

  /* Fixed footer, wrappable. */
  .foot {
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px;
    padding-top: 6px; margin-top: 6px; border-top: 1px solid var(--hair);
  }
  .hist { color: var(--meta); }
  .hint { color: var(--hint); }

  .explain { color: var(--meta); padding-top: 6px; max-width: 360px; }
</style>
</head>
<body>

</figure>
